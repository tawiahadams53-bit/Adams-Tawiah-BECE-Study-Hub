<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Termux Web</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#e8e8e8;--dim:#8b8b8b;--green:#5ef05e;--blue:#6aa7ff;--red:#ff7070;--key:#1d1d1d;--keyhi:#2f2f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{display:flex;flex-direction:column;font:16px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
#term{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;white-space:pre-wrap;word-break:break-all;-webkit-overflow-scrolling:touch}
#term div{min-height:1.4em}
.cmd{color:var(--fg)}.err{color:var(--red)}.dim{color:var(--dim)}.d{color:var(--blue);font-weight:700}.ok{color:var(--green)}
#line{display:flex;align-items:baseline}
#ps{color:var(--green);white-space:pre;flex:none}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;padding:0;caret-color:var(--green)}
#keys{display:flex;gap:4px;padding:6px;overflow-x:auto;background:#0b0b0b;border-top:1px solid #222;scrollbar-width:none}
#keys::-webkit-scrollbar{display:none}
#keys button{flex:1 0 auto;min-width:48px;height:42px;border:0;border-radius:6px;background:var(--key);color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
#keys button:active{background:var(--keyhi)}
#keys button:focus-visible{outline:2px solid var(--green)}
</style>
</head>
<body>
<div id="term" aria-live="polite">
  <div id="line"><span id="ps"></span><input id="in" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Terminal input"></div>
</div>
<div id="keys">
  <button data-k="tab">TAB</button><button data-k="c">CTRL+C</button><button data-k="l">CTRL+L</button>
  <button data-k="up">↑</button><button data-k="down">↓</button><button data-k="left">←</button><button data-k="right">→</button>
  <button data-i="/">/</button><button data-i="-">-</button><button data-i="~">~</button><button data-i=".">.</button><button data-i=">">&gt;</button>
</div>
<script>
const term=document.getElementById('term'),inp=document.getElementById('in'),ps=document.getElementById('ps'),line=document.getElementById('line');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const isDir=n=>n!==null&&typeof n==='object';
let fs=null,cwd=[],hist=[],hi=0,busy=false,cancel=false;
const def=()=>({"README.md":"Welcome to Termux Web.\nType help to see what you can run.\n","hello.txt":"Hello, world!\n",projects:{},storage:{}});
try{fs=JSON.parse(localStorage.getItem('tw_fs'));hist=JSON.parse(localStorage.getItem('tw_h'))}catch(e){}
if(!isDir(fs)||Array.isArray(fs))fs=def();
if(!Array.isArray(hist))hist=[];
hi=hist.length;
const save=()=>{try{localStorage.setItem('tw_fs',JSON.stringify(fs));localStorage.setItem('tw_h',JSON.stringify(hist.slice(-100)))}catch(e){}};

function rp(p){const b=/^[\/~]/.test(p)?[]:cwd.slice();p.replace(/^~/,'').split('/').forEach(s=>{if(!s||s==='.')return;if(s==='..')b.pop();else b.push(s)});return b}
function get(a){let n=fs;for(const k of a){if(!isDir(n)||!Object.hasOwn(n,k))return;n=n[k]}return n}
function slot(p){const a=rp(p),name=a.pop(),dir=get(a);return{dir:isDir(dir)?dir:null,name}}
const badName=n=>!n||n==='__proto__'||n==='constructor';
const pwd=()=>'~'+(cwd.length?'/'+cwd.join('/'):'');
const setPs=()=>{ps.textContent=pwd()+' $ '};
const down=()=>{term.scrollTop=term.scrollHeight};

function print(x,c){
  const d=document.createElement('div');
  if(Array.isArray(x))x.forEach(s=>{const e=document.createElement('span');e.textContent=s.t;if(s.c)e.className=s.c;d.appendChild(e)});
  else{d.textContent=x;if(c)d.className=c}
  term.insertBefore(d,line);down();return d;
}

const C={
help(a,out){
  [
  "Files:    ls [-a] [-l]  cd  pwd  cat  mkdir  touch  rm [-r]  cp  mv",
  "Text:     echo hi > file.txt   (> and >> redirects work)",
  "System:   whoami  date  uname [-a]  neofetch  history  clear  reset",
  "Packages: pkg install <name>  (simulated)",
  "Keys:     TAB completes, up and down browse history, CTRL+C cancels",
  "",
  "This is a simulated shell. Files live in your browser on this device."
  ].forEach(l=>out(l))
},
ls(a,out){
  const fl=a.filter(x=>x[0]==='-').join(''),args=a.filter(x=>x[0]!=='-');
  const p=args[0]||'.',n=get(rp(p));
  if(n===undefined)return out('ls: '+p+': No such file or directory','err');
  if(!isDir(n))return out(p);
  let names=Object.keys(n).sort();
  if(!fl.includes('a'))names=names.filter(k=>k[0]!=='.');
  if(fl.includes('l'))return names.forEach(k=>out([{t:isDir(n[k])?'drwx------  ':'-rw-------  '+String(n[k].length).padStart(6)+'  '},{t:k,c:isDir(n[k])?'d':''}]));
  if(names.length)out(names.flatMap(k=>[{t:k,c:isDir(n[k])?'d':''},{t:'  '}]));
},
cd(a,out){
  const p=a[0]||'~',n=get(rp(p));
  if(n===undefined)return out('bash: cd: '+p+': No such file or directory','err');
  if(!isDir(n))return out('bash: cd: '+p+': Not a directory','err');
  cwd=rp(p);setPs();
},
pwd(a,out){out('/home'+(cwd.length?'/'+cwd.join('/'):''))},
cat(a,out){
  if(!a.length)return out('cat: missing file','err');
  a.forEach(p=>{const n=get(rp(p));
    if(n===undefined)out('cat: '+p+': No such file or directory','err');
    else if(isDir(n))out('cat: '+p+': Is a directory','err');
    else out(n.replace(/\n$/,''));});
},
echo(a,out){out(a.join(' '))},
mkdir(a,out){
  a.filter(x=>x[0]!=='-').forEach(p=>{const s=slot(p);
    if(!s.dir||badName(s.name))out('mkdir: cannot create directory '+p,'err');
    else if(Object.hasOwn(s.dir,s.name))out('mkdir: '+p+': File exists','err');
    else s.dir[s.name]={};});
},
touch(a,out){
  a.forEach(p=>{const s=slot(p);
    if(!s.dir||badName(s.name))out('touch: cannot touch '+p,'err');
    else if(!Object.hasOwn(s.dir,s.name))s.dir[s.name]='';});
},
rm(a,out){
  const r=a.some(x=>/^-.*r/i.test(x));
  a.filter(x=>x[0]!=='-').forEach(p=>{const s=slot(p),n=s.dir&&get(rp(p));
    if(n===undefined||!s.dir)out('rm: '+p+': No such file or directory','err');
    else if(isDir(n)&&!r)out('rm: '+p+': Is a directory (use -r)','err');
    else delete s.dir[s.name];});
},
cp(a,out){
  const n=get(rp(a[0]||'')),s=slot(a[1]||'');
  if(typeof n!=='string')return out('cp: only files can be copied','err');
  if(!s.dir||badName(s.name))return out('cp: cannot create '+a[1],'err');
  s.dir[s.name]=n;
},
mv(a,out){
  const f=slot(a[0]||''),n=f.dir&&get(rp(a[0])),s=slot(a[1]||'');
  if(n===undefined||!f.dir)return out('mv: '+a[0]+': No such file or directory','err');
  if(!s.dir||badName(s.name))return out('mv: cannot move to '+a[1],'err');
  s.dir[s.name]=n;delete f.dir[f.name];
},
whoami(a,out){out('u0_a247')},
date(a,out){out(new Date().toString())},
uname(a,out){out(a.includes('-a')?'Linux localhost 5.15.0 #1 SMP PREEMPT aarch64 Android':'Linux')},
neofetch(a,out){
  ['u0_a247@localhost','-----------------','OS: Android (simulated)','Shell: bash (web)','Terminal: Termux Web','Browser: '+(navigator.userAgent.match(/(Firefox|Edg|Chrome|Safari)\/[\d.]+/)||['unknown'])[0]].forEach(l=>out(l,'ok'));
},
history(a,out){hist.forEach((h,i)=>out(String(i+1).padStart(4)+'  '+h))},
clear(){[...term.children].forEach(c=>{if(c!==line)c.remove()})},
reset(a,out){fs=def();cwd=[];setPs();out('Files reset to defaults.')},
async pkg(a,out){
  const sub=a[0],names=a.slice(1);
  if(['update','upgrade'].includes(sub))return out('All packages are up to date. (simulated)');
  if(sub!=='install'&&sub!=='i')return out('usage: pkg install <package> | update | upgrade','err');
  if(!names.length)return out('pkg: name a package to install','err');
  for(const p of names){
    print('Reading package lists... Done');
    const bar=print('');
    for(let i=0;i<=10;i++){
      if(cancel)return;
      bar.textContent=p+' ['+'#'.repeat(i)+'.'.repeat(10-i)+'] '+i*10+'%';
      await sleep(110);
    }
    print('Setting up '+p+' ... done (simulated, nothing was installed)','ok');
  }
},
};
C.apt=C.pkg;

const RX=/"([^"]*)"|'([^']*)'|(>>|>)|([^\s>]+)/g;
async function run(s){
  print(ps.textContent+s,'cmd');
  s=s.trim();if(!s)return;
  if(hist[hist.length-1]!==s)hist.push(s);
  hi=hist.length;
  const t=[...s.matchAll(RX)].map(m=>({v:m[3]??m[1]??m[2]??m[4],op:m[3]!==undefined}));
  const ri=t.findIndex(x=>x.op);
  const args=t.filter((x,j)=>!x.op&&!(j>0&&t[j-1].op)).map(x=>x.v);
  const redir=ri>=0;let buf='';
  if(redir&&!t[ri+1])return print('bash: syntax error near redirect','err');
  const out=(x,c)=>{if(redir)buf+=(Array.isArray(x)?x.map(q=>q.t).join(''):x)+'\n';else print(x,c)};
  const name=args.shift();
  if(!name)return;
  if(!Object.hasOwn(C,name))out('bash: '+name+': command not found','err');
  else{try{await C[name](args,out)}catch(e){out(name+': '+e.message,'err')}}
  if(redir){
    const s2=slot(t[ri+1].v);
    if(!s2.dir||badName(s2.name))print('bash: '+t[ri+1].v+': cannot write','err');
    else s2.dir[s2.name]=(t[ri].v==='>>'&&typeof s2.dir[s2.name]==='string'?s2.dir[s2.name]:'')+buf;
  }
  save();
}

async function submit(){
  if(busy)return;
  const v=inp.value;inp.value='';busy=true;cancel=false;
  await run(v);
  busy=false;down();
}

function complete(){
  const v=inp.value,words=v.split(' '),last=words.pop();
  let cands;
  if(!words.length)cands=Object.keys(C).filter(k=>k.startsWith(last));
  else{
    const i=last.lastIndexOf('/'),dirP=last.slice(0,i+1),base=last.slice(i+1),n=get(rp(dirP||'.'));
    cands=isDir(n)?Object.keys(n).filter(k=>k.startsWith(base)).map(k=>dirP+k+(isDir(n[k])?'/':'')):[];
  }
  if(!cands.length)return;
  if(cands.length===1){inp.value=[...words,cands[0]+(cands[0].endsWith('/')?'':' ')].join(' ');return}
  let cp=cands[0];cands.forEach(c=>{while(!c.startsWith(cp))cp=cp.slice(0,-1)});
  inp.value=[...words,cp].join(' ');
  print(ps.textContent+v,'cmd');print(cands.join('  '),'dim');
}
function hnav(d){
  if(d<0&&hi>0)hi--;else if(d>0&&hi<hist.length)hi++;
  inp.value=hist[hi]||'';
  setTimeout(()=>inp.setSelectionRange(inp.value.length,inp.value.length));
}
function ctrlC(){
  if(busy){cancel=true;print('^C','err');return}
  print(ps.textContent+inp.value+'^C','cmd');inp.value='';
}
function caret(d){const p=inp.selectionStart+d;inp.setSelectionRange(p,p)}

inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();submit()}
  else if(e.key==='Tab'){e.preventDefault();complete()}
  else if(e.key==='ArrowUp'){e.preventDefault();hnav(-1)}
  else if(e.key==='ArrowDown'){e.preventDefault();hnav(1)}
  else if(e.ctrlKey&&e.key==='c'){e.preventDefault();ctrlC()}
  else if(e.ctrlKey&&e.key==='l'){e.preventDefault();C.clear()}
});
document.getElementById('keys').addEventListener('mousedown',e=>e.preventDefault());
document.getElementById('keys').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const k=b.dataset.k,ch=b.dataset.i;
  if(ch){const p=inp.selectionStart;inp.setRangeText(ch,p,inp.selectionEnd,'end')}
  else if(k==='tab')complete();
  else if(k==='c')ctrlC();
  else if(k==='l')C.clear();
  else if(k==='up')hnav(-1);
  else if(k==='down')hnav(1);
  else if(k==='left')caret(-1);
  else if(k==='right')caret(1);
  inp.focus();
});
term.addEventListener('click',()=>{if(!String(getSelection()))inp.focus()});

setPs();
print('Welcome to Termux Web!','ok');
print('Simulated shell: it does not run real Linux. Type help to start.','dim');
print('');
inp.focus();
</script>
</body>
</html>
