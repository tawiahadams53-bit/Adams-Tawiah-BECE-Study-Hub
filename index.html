<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adams Tawiah | BECE Study Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 18px;
            color: #d1d5db;
        }

        .search-box {
            display: flex;
            max-width: 600px;
            margin: auto;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
        }

        .search-box button {
            padding: 12px 18px;
            border: none;
            border-radius: 0 8px 8px 0;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .top-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .top-buttons button {
            padding: 9px 13px;
            border: none;
            border-radius: 8px;
            background: #374151;
            color: white;
            cursor: pointer;
        }

        .top-buttons button:hover {
            background: #4b5563;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 20px 15px;
        }

        section {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        section h2 {
            margin-top: 0;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .subject {
            padding: 18px;
            background: #eef2ff;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .math-note {
            background: #f8fafc;
            padding: 15px;
            border-left: 4px solid #2563eb;
            margin-top: 12px;
            border-radius: 6px;
        }

        .math-game {
            text-align: center;
        }

        #game-question {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }

        #game-answer {
            padding: 10px;
            width: 150px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .game-button {
            padding: 10px 15px;
            margin-left: 5px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        #game-result {
            margin-top: 15px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            background: #111827;
            color: white;
        }

        .info-panel {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .panel-content {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border-radius: 15px;
            position: relative;
            color: #222;
        }

        .close-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: #222;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 25px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input,
            .search-box button {
                border-radius: 8px;
                margin-bottom: 5px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Adams Hub</h1>
    <p>BECE Study Hub</p>

    <form class="search-box"
          action="https://www.google.com/search"
          method="GET"
          target="_blank">

        <input
            type="search"
            name="q"
            placeholder="Search the Internet..."
            required>

        <button type="submit">Search</button>
    </form>

    <div class="top-buttons">

        <button onclick="showPanel('developer-panel')">
            🧑‍💻 Developer
        </button>

        <button onclick="showPanel('about-panel')">
            ℹ️ About
        </button>

        <button onclick="scrollToSubjects()">
            📚 Subjects
        </button>

        <button onclick="showPanel('settings-panel')">
            ⚙️ Settings
        </button>

    </div>
</header>

<main>

    <section>
        <h2>🏠
